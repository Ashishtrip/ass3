<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Timer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="timer-container">
        <h1>Countdown Timer</h1>
        <div class="time-label">One Hour Countdown</div>
        <div class="timer-display" id="display">60:00</div>
        <div class="buttons">
            <button class="btn-start" id="startBtn" onclick="startTimer()">Start</button>
            <button class="btn-pause" id="pauseBtn" onclick="pauseTimer()" disabled>Pause</button>
            <button class="btn-reset" id="resetBtn" onclick="resetTimer()">Reset</button>
        </div>
        <div class="message" id="message"></div>
    </div>

    <script>
        // One hour in seconds (60 minutes * 60 seconds)
        const ONE_HOUR = 60 * 60;
        
        let timeRemaining = ONE_HOUR;
        let timerInterval = null;
        let isRunning = false;

        const display = document.getElementById('display');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const message = document.getElementById('message');

        // Format time as MM:SS
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        // Update the display
        function updateDisplay() {
            display.textContent = formatTime(timeRemaining);
        }

        // Start the timer
        function startTimer() {
            if (isRunning) return;
            
            if (timeRemaining <= 0) {
                showMessage("Timer already finished! Reset to start again.");
                return;
            }

            isRunning = true;
            startBtn.disabled = true;
            pauseBtn.disabled = false;
            message.textContent = "";
            display.classList.remove('ended');

            timerInterval = setInterval(() => {
                if (timeRemaining > 0) {
                    timeRemaining--;
                    updateDisplay();
                } else {
                    // Timer reached zero
                    clearInterval(timerInterval);
                    isRunning = false;
                    display.classList.add('ended');
                    showMessage("Time's up! Countdown complete.");
                    startBtn.disabled = false;
                    pauseBtn.disabled = true;
                }
            }, 1000);
        }

        // Pause the timer
        function pauseTimer() {
            if (!isRunning) return;
            
            clearInterval(timerInterval);
            isRunning = false;
            startBtn.disabled = false;
            pauseBtn.disabled = true;
            showMessage("Timer paused");
        }

        // Reset the timer
        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            timeRemaining = ONE_HOUR;
            updateDisplay();
            display.classList.remove('ended');
            startBtn.disabled = false;
            pauseBtn.disabled = true;
            message.textContent = "";
        }

        // Show message
        function showMessage(msg) {
            message.textContent = msg;
            message.classList.add('show');
            setTimeout(() => {
                message.classList.remove('show');
            }, 500);
        }

        // Initialize display
        updateDisplay();
    </script>
</body>
</html>
