<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Timer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }

        .timer-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px 60px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            color: #fff;
            margin-bottom: 30px;
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .timer-display {
            font-size: 5rem;
            font-weight: bold;
            color: #00d9ff;
            text-shadow: 0 0 20px rgba(0, 217, 255, 0.5);
            margin: 30px 0;
            font-family: 'Courier New', monospace;
            letter-spacing: 5px;
        }

        .timer-display.ended {
            color: #ff4757;
            text-shadow: 0 0 20px rgba(255, 71, 87, 0.5);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }

        button {
            padding: 12px 30px;
            font-size: 1rem;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .btn-start {
            background: linear-gradient(135deg, #00d9ff, #0099ff);
            color: #fff;
        }

        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 217, 255, 0.4);
        }

        .btn-pause {
            background: linear-gradient(135deg, #ffa502, #ff7f50);
            color: #fff;
        }

        .btn-pause:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 165, 2, 0.4);
        }

        .btn-reset {
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            color: #fff;
        }

        .btn-reset:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 71, 87, 0.4);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            color: #2ed573;
            font-size: 1.2rem;
            margin-top: 20px;
            min-height: 30px;
            font-weight: 600;
        }

        .message.show {
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .time-label {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="timer-container">
        <h1>Countdown Timer</h1>
        <div class="time-label">One Hour Countdown</div>
        <div class="timer-display" id="display">60:00</div>
        <div class="buttons">
            <button class="btn-start" id="startBtn" onclick="startTimer()">Start</button>
            <button class="btn-pause" id="pauseBtn" onclick="pauseTimer()" disabled>Pause</button>
            <button class="btn-reset" id="resetBtn" onclick="resetTimer()">Reset</button>
        </div>
        <div class="message" id="message"></div>
    </div>

    <script>
        // One hour in seconds (60 minutes * 60 seconds)
        const ONE_HOUR = 60 * 60;
        
        let timeRemaining = ONE_HOUR;
        let timerInterval = null;
        let isRunning = false;

        const display = document.getElementById('display');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const message = document.getElementById('message');

        // Format time as MM:SS
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        // Update the display
        function updateDisplay() {
            display.textContent = formatTime(timeRemaining);
        }

        // Start the timer
        function startTimer() {
            if (isRunning) return;
            
            if (timeRemaining <= 0) {
                showMessage("Timer already finished! Reset to start again.");
                return;
            }

            isRunning = true;
            startBtn.disabled = true;
            pauseBtn.disabled = false;
            message.textContent = "";
            display.classList.remove('ended');

            timerInterval = setInterval(() => {
                if (timeRemaining > 0) {
                    timeRemaining--;
                    updateDisplay();
                } else {
                    // Timer reached zero
                    clearInterval(timerInterval);
                    isRunning = false;
                    display.classList.add('ended');
                    showMessage("Time's up! Countdown complete.");
                    startBtn.disabled = false;
                    pauseBtn.disabled = true;
                }
            }, 1000);
        }

        // Pause the timer
        function pauseTimer() {
            if (!isRunning) return;
            
            clearInterval(timerInterval);
            isRunning = false;
            startBtn.disabled = false;
            pauseBtn.disabled = true;
            showMessage("Timer paused");
        }

        // Reset the timer
        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            timeRemaining = ONE_HOUR;
            updateDisplay();
            display.classList.remove('ended');
            startBtn.disabled = false;
            pauseBtn.disabled = true;
            message.textContent = "";
        }

        // Show message
        function showMessage(msg) {
            message.textContent = msg;
            message.classList.add('show');
            setTimeout(() => {
                message.classList.remove('show');
            }, 500);
        }

        // Initialize display
        updateDisplay();
    </script>
</body>
</html>
